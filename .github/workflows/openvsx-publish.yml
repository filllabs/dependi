name: Publish to OpenVSX
on:
  push:
    tags:
      - v*
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: ./vscode
jobs:
  vscode-extension-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 22
      - name: Require tag to match package.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match vscode/package.json version ${VERSION} (expected v${VERSION})."
            exit 1
          fi
      - name: Install Dependencies
        run: npm install --save-exact --save-dev esbuild
      - name: Publish to OpenVSX
        run: |
          npm install -g ovsx
          ovsx publish -p $OVSX_TOKEN
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_PAT }}

      - name: Send Download Link to Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "VSCode extension deployed to OpenVSX successfully!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}