id = "dependi"
name = "Dependi"
version = "1.50.0"
schema_version = 1
authors = ["Fill Labs <info@dependi.io>"]
description = "Manage dependency versions and vulnerabilities for Rust, Go, JavaScript, Python, PHP, Dart, C#, Elixir, Gradle, and Terraform."
repository = "https://github.com/filllabs/dependi"

[language_servers.dependi]
name = "Dependi"
# Official names (when those extensions are installed) plus bundled fallbacks
# so every VS Code manifest attaches without extra language extensions.
languages = [
  "TOML",
  "JSON",
  "JSONC",
  "YAML",
  "XML",
  "C#",
  "CSharp",
  "F#",
  "FSharp",
  "Go",
  "Go Mod",
  "Elixir",
  "Dart",
  "Terraform",
  "OpenTofu",
  "HCL",
  "Groovy",
  "Kotlin",
  "Java",
  "Python",
  "Pip Requirements",
  "Plain Text",
  "Properties",
  "Java Properties",
  "INI",
  "Dependi Manifest",
]

[language_servers.dependi.language_ids]
"TOML" = "toml"
"JSON" = "json"
"JSONC" = "jsonc"
"YAML" = "yaml"
"XML" = "xml"
"Go" = "go"
"Go Mod" = "gomod"
"C#" = "csharp"
"CSharp" = "csharp"
"F#" = "fsharp"
"FSharp" = "fsharp"
"Elixir" = "elixir"
"Dart" = "dart"
"Terraform" = "terraform"
"OpenTofu" = "opentofu"
"HCL" = "hcl"
"Groovy" = "groovy"
"Kotlin" = "kotlin"
"Java" = "java"
"Python" = "python"
"Pip Requirements" = "pip-requirements"
"Plain Text" = "plaintext"
"Properties" = "properties"
"Java Properties" = "properties"
"INI" = "ini"
"Dependi Manifest" = "dependi-manifest"
